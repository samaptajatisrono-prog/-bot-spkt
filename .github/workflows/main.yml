name: Run Daily Bot SPKT

on:
  schedule:
    # Jalan otomatis setiap hari pukul 01.00 WIB dini hari (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Library
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Jalankan Bot SPKT
        run: python bot_spkt.py
        env:
          POSKO_EMAIL: ${{ secrets.POSKO_EMAIL }}
          POSKO_PASSWORD: ${{ secrets.POSKO_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
