name: Input Otomatis SPKT Harian

on:
  schedule:
    # Jalan otomatis 1 kali sehari pukul 09.00 WIB (02.00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  jalankan-bot-spkt:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Library
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Jalankan Robot SPKT
        env:
          POSKO_EMAIL: ${{ secrets.POSKO_EMAIL }}
          POSKO_PASSWORD: ${{ secrets.POSKO_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_spkt.py
